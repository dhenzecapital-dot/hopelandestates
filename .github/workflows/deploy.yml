name: Deploy HopeLand Website

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

      - name: Run TypeScript validation
        run: npm run lint

      - name: Build production website
        run: npm run build

      - name: Verify deployment output
        run: |
          touch dist/.nojekyll
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/logo.svg
          test -f dist/assets/branding/hopeland-official-logo.png
          test -f dist/assets/branding/hopeland-official-logo-transparent.png
          echo "Production files verified."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
